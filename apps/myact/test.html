<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyACT アラート・スポット テスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>MyACT アラート・スポット機能テスト</h1>
    
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            // Test 1: SOTA App API アラート取得
            try {
                const response = await fetch('https://sotaapp2.sotalive.net/api/v2/activation/alerts?hours_ago=24&limit=5');
                const data = await response.json();
                
                results.innerHTML += `
                    <div class="test-result">
                        <h3>✅ アラートAPI テスト</h3>
                        <div class="status success">
                            ステータス: ${response.status}<br>
                            データ取得数: ${Array.isArray(data) ? data.length : 'N/A'}件<br>
                            ${Array.isArray(data) && data[0] ? `サンプル: ${JSON.stringify(data[0], null, 2).substring(0, 200)}...` : ''}
                        </div>
                    </div>
                `;
            } catch (error) {
                results.innerHTML += `
                    <div class="test-result">
                        <h3>❌ アラートAPI テスト</h3>
                        <div class="status error">エラー: ${error.message}</div>
                    </div>
                `;
            }
            
            // Test 2: スポットAPI テスト
            try {
                const response = await fetch('https://sotaapp2.sotalive.net/api/v2/activation/spots?pat_ref=^(JA|JP-)&hours_ago=6');
                const data = await response.json();
                
                results.innerHTML += `
                    <div class="test-result">
                        <h3>✅ スポットAPI テスト</h3>
                        <div class="status success">
                            ステータス: ${response.status}<br>
                            データ取得数: ${Array.isArray(data) ? data.length : 'N/A'}件<br>
                            ${Array.isArray(data) && data[0] ? `サンプル: ${JSON.stringify(data[0], null, 2).substring(0, 200)}...` : ''}
                        </div>
                    </div>
                `;
            } catch (error) {
                results.innerHTML += `
                    <div class="test-result">
                        <h3>❌ スポットAPI テスト</h3>
                        <div class="status error">エラー: ${error.message}</div>
                    </div>
                `;
            }
            
            // Test 3: ローカルストレージテスト（アラート機能）
            try {
                const testAlert = {
                    id: 'test-123',
                    title: 'テストアラート',
                    reference: 'JA/ST-001',
                    program: 'SOTA',
                    operationDate: new Date(Date.now() + 3600000).toISOString(),
                    callsign: 'JA1TEST',
                    createdAt: new Date().toISOString()
                };
                
                localStorage.setItem('myact_operation_alerts', JSON.stringify([testAlert]));
                const stored = JSON.parse(localStorage.getItem('myact_operation_alerts') || '[]');
                
                results.innerHTML += `
                    <div class="test-result">
                        <h3>✅ ローカルストレージ テスト</h3>
                        <div class="status success">
                            アラート保存・取得: 成功<br>
                            保存されたアラート: ${stored.length}件
                        </div>
                    </div>
                `;
            } catch (error) {
                results.innerHTML += `
                    <div class="test-result">
                        <h3>❌ ローカルストレージ テスト</h3>
                        <div class="status error">エラー: ${error.message}</div>
                    </div>
                `;
            }
            
            results.innerHTML += `
                <div class="test-result">
                    <h3>📊 総合評価</h3>
                    <div class="status info">
                        MyACTアラート・スポットカード表示機能の基本的なAPI統合とデータ保存機能が正常に動作しています。<br>
                        ネットワーク接続に問題がなければ、本機能は期待通りに動作するはずです。
                    </div>
                </div>
            `;
        }
        
        // ページロード時にテスト実行
        testAPI();
    </script>
</body>
</html>
