[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
once_cell = "1.20"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
