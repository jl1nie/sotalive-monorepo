name: CI

# テストとデプロイ。テストのジョブは並列に走り、変わったパスに関係するものだけを走らせる。
# ビルドは1回だけ(build)で、プロジェクトごとの出力を artifact で各デプロイのジョブに渡す。
# デプロイ(push のときだけ)は、Pages のプロジェクトごとに並列で、そのプロジェクトに関係するテストだけを待つ。
on:
  push:
    branches:
      - main      # Production deploy
      - develop   # Preview deploy
      - 'feat/**' # Preview deploy (動作確認用)
  pull_request:
    branches:
      - main
      - develop

# 同じブランチで1本ずつ(続けてマージしたとき、古い内容が後から上書きしないように)。PR は新しい push で古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # デプロイに使う wrangler(ルートの devDependencies と同じ版。デプロイのジョブでは pnpm install しない)
  WRANGLER: wrangler@4.54.0

jobs:
  # 変わったパスを判定する。all は、どれにも効く共通の部分(変わったら、すべて走らせる)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.filter.outputs.all }}
      rust: ${{ steps.filter.outputs.rust }}
      fle: ${{ steps.filter.outputs.fle }}
      logconv: ${{ steps.filter.outputs.logconv }}
      myact: ${{ steps.filter.outputs.myact }}
      geo: ${{ steps.filter.outputs.geo }}
      myqth: ${{ steps.filter.outputs.myqth }}
      myact_next: ${{ steps.filter.outputs.myact_next }}
      functions: ${{ steps.filter.outputs.functions }}
      golden: ${{ steps.filter.outputs.golden }}
      legacy: ${{ steps.filter.outputs.legacy }}
      parks: ${{ steps.filter.outputs.parks }}
      sotalive: ${{ steps.filter.outputs.sotalive }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            all:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/shared/**'
              - 'scripts/**'
            rust:
              - 'crates/**'
            fle:
              - 'apps/fle/**'
              - 'crates/**'
              - 'pages/fle/**'
            logconv:
              - 'apps/logconv/**'
              - 'pages/logconv/**'
            myact:
              - 'apps/myact/**'
            geo:
              - 'packages/geo/**'
            myqth:
              - 'apps/myqth/**'
              - 'packages/geo/**'
            myact_next:
              - 'apps/myact-next/**'
              - 'packages/geo/**'
              - 'packages/myact-golden/**'
            functions:
              - 'functions/**'
              - 'packages/functions-test/**'
              # FLE の同期(KV)と中継。同期の約束のテストは、アプリの設定・予定のコードも読む
              - 'pages/fle/functions/**'
              - 'apps/fle/src/**'
              # LogConverter の中継
              - 'pages/logconv/functions/**'
            golden:
              - 'packages/myact-golden/**'
              - 'apps/myact-org/**'
              - 'packages/shared/common/**'
            legacy:
              - 'apps/myact-org/**'
              - 'apps/myqth-org/**'
            parks:
              - 'tools/jaffpota/**'
              - 'packages/shared/common/js/myact.js'
            sotalive:
              - 'functions/**'
              - 'wrangler.toml'
              - 'apps/myact/**'
              - 'apps/myact-next/**'
              - 'apps/myqth/**'
              - 'packages/geo/**'

  # ---- テスト(並列) ----

  rust:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  fle:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.fle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fle-wasm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # PR では、変わった箇所に関係するテストだけ(scripts/fle-test.sh)。push(デプロイの前)は全部。
      # 型検査と lint は速いので、いつも全部
      - name: Fetch the PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - name: Typecheck, test and lint
        working-directory: apps/fle
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          pnpm exec tsc -b
          ../../scripts/fle-test.sh "$BASE"
          pnpm exec eslint .

  logconv:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.logconv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and lint
        working-directory: apps/logconv
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run
          pnpm exec eslint .

  myact:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.myact == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and lint
        working-directory: apps/myact
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run --passWithNoTests
          pnpm exec eslint .

  # 逆ジオコーダーなど、フレームワークに依らない共通の TS(packages/geo)
  geo:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.geo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and lint
        working-directory: packages/geo
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run
          pnpm exec eslint .

  # 旧版 MyACT を固定の応答で動かし、ポップアップ・マーカーなどの出力が、記録(packages/myact-golden/expected)と同じか
  # (次期 MyACT の基準。旧版を意図して変えたら、record して、差分を見る)
  myact-golden:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.golden == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - name: Verify the golden master
        run: pnpm --filter @sotalive/myact-golden verify

  # functions/_middleware.ts の、ホスト名による振り分け(ASSETS を差し替えて確かめる)と、
  # FLE の Pages Functions(pages/fle/functions: 同期の KV・バックエンドへの中継・アプリとの約束)
  functions:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Test and lint
        working-directory: packages/functions-test
        run: |
          pnpm exec vitest run
          pnpm exec eslint .

  # 新しい MyQTH(Vite + 素の TS): 型・単体テスト・lint、ビルドしたものをブラウザーで開くテスト(外部の API は固定の応答)
  myqth:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.myqth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and lint
        working-directory: apps/myqth
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run
          pnpm exec eslint .
      - name: Build
        run: pnpm --filter @sotalive/myqth run build
      - uses: ./.github/actions/playwright-chromium
      - name: Open the built app in a browser
        run: node --test apps/myqth/e2e/myqth.e2e.mjs

  # 次期 MyACT(Vite + 素の TS。myact2 で公開): 型・単体テスト・lint、ビルドしたものをブラウザーで開くテスト
  # (外部の API は、旧版の golden master と同じ固定の応答。旧版の記録と、ポップアップの行を比べる)
  myact-next:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.myact_next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, test and lint
        working-directory: apps/myact-next
        run: |
          pnpm exec tsc -b
          pnpm exec vitest run
          pnpm exec eslint .
      - name: Build
        run: pnpm --filter @sotalive/myact-next run build
      - uses: ./.github/actions/playwright-chromium
      - name: Open the built app in a browser
        run: node --test apps/myact-next/e2e/myact-next.e2e.mjs

  # 旧版(myqth・myact。テストのない jQuery 版)と共通アセット: 共通 JS のテスト、index.html の構文の検査、
  # ブラウザーで開く最低限のテスト(外部の API は固定の応答。地図のクリックでポップアップが出る・起動で例外が出ない)
  legacy:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    # ふだんは 1 分ほど。ブラウザーの取得が止まったときに、何時間も待たない(依存の apt は、150 秒 × 3 回まで再試行する)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Test shared legacy JS and the legacy index.html
        run: node --test packages/shared/tests/*.test.mjs
      - uses: ./.github/actions/playwright-chromium
      - name: Open the legacy apps in a browser
        run: node --test packages/shared/tests/legacy.e2e.mjs

  # 公園区域 TopoJSON の検証と生成ツールのテスト(固定版の入力からの再生成も含む。1 分ほど)
  parks:
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.parks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test
        working-directory: tools/jaffpota
        run: uv run --frozen python -m unittest discover -s tests -t . -v

  # ---- ビルド(1回。テストと並列) ----

  # デプロイするものか、ビルドに関係するものが変わったときだけ(ドキュメントだけの変更では走らない)
  build:
    needs: changes
    if: >-
      needs.changes.outputs.all == 'true' || needs.changes.outputs.fle == 'true'
      || needs.changes.outputs.logconv == 'true' || needs.changes.outputs.myact == 'true'
      || needs.changes.outputs.legacy == 'true' || needs.changes.outputs.myqth == 'true'
      || needs.changes.outputs.myact_next == 'true' || needs.changes.outputs.sotalive == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/fle-wasm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build apps
        run: |
          pnpm --filter @sotalive/fle run build:web
          pnpm --filter @sotalive/logconv --filter @sotalive/myact-next --filter @sotalive/myqth run build
      - name: Assemble the outputs for each Pages project
        run: scripts/assemble.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-myact
          path: dist-myact
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-myqth
          path: dist-myqth
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-logconv
          path: dist-logconv
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: dist-fle
          path: dist-fle
          include-hidden-files: true
          retention-days: 3

  # ---- デプロイ(push のときだけ。プロジェクトごとに並列) ----
  # 待つジョブのどれかが失敗・中止なら、デプロイしない(変更がなくて飛ばしたテストは、待たずに進む)

  # sotalive: まだ公開していない myact2(次期 MyACT)・myqth2(functions/_middleware.ts)
  deploy-sotalive:
    needs: [changes, build, myact, myact-next, myqth, geo, functions]
    if: >-
      always() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.all == 'true' || needs.changes.outputs.sotalive == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # functions/ と wrangler.toml を使う
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: npx --yes "$WRANGLER" pages deploy dist --project-name=sotalive --branch="$BRANCH"

  # myact(旧版)と myqth(新版): Functions なし。出力の中からデプロイする(functions/ と wrangler.toml を拾わない)
  deploy-legacy:
    needs: [changes, build, parks, legacy, myqth, geo]
    if: >-
      always() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.all == 'true' || needs.changes.outputs.legacy == 'true'
        || needs.changes.outputs.myqth == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [myact, myqth]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: dist-${{ matrix.app }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        working-directory: dist-${{ matrix.app }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: npx --yes "$WRANGLER" pages deploy . --project-name="sotalive-${{ matrix.app }}" --branch="$BRANCH"

  # LogConverter: Functions は /api の下だけ(pages/logconv の wrangler.toml と functions/)
  deploy-logconv:
    needs: [changes, build, logconv, functions]
    if: >-
      always() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.all == 'true' || needs.changes.outputs.logconv == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-logconv
          path: dist-logconv
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        working-directory: pages/logconv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: npx --yes "$WRANGLER" pages deploy --project-name=sotalive-logconv --branch="$BRANCH"

  # FLEonline: Functions は /api の下だけ(pages/fle の wrangler.toml と functions/。KV の束縛もそこ)
  deploy-fle:
    needs: [changes, build, rust, fle, functions]
    if: >-
      always() && github.event_name == 'push'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.changes.outputs.all == 'true' || needs.changes.outputs.fle == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-fle
          path: dist-fle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        working-directory: pages/fle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: npx --yes "$WRANGLER" pages deploy --project-name=sotalive-fle --branch="$BRANCH"
