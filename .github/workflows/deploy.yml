name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main      # Production deploy
      - develop   # Preview deploy
      - 'feat/**' # Preview deploy (動作確認用)

# デプロイは、同じブランチで1本ずつ(続けてマージしたとき、古い内容が後から上書きしないように)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # テスト(Rust・画面・lint)が通らなければ、デプロイしない
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sotalive --branch=${{ github.ref_name }}

      # 公開しているアプリは、それぞれ別のプロジェクト(静的なファイルは Functions の無料枠を使わない)。
      # 旧版の myact・myqth は Functions なし: functions/ と wrangler.toml を拾わないよう、出力の中からデプロイする
      - name: Deploy legacy myact and myqth (static only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for app in myact myqth; do
            (cd "dist-$app" && ../node_modules/.bin/wrangler pages deploy . --project-name="sotalive-$app" --branch="$BRANCH")
          done

      # FLEonline: Functions は /api の下だけ(pages/fle の wrangler.toml と functions/。KV の束縛もそこ)
      - name: Deploy FLEonline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: (cd pages/fle && ../../node_modules/.bin/wrangler pages deploy --project-name=sotalive-fle --branch="$BRANCH")
