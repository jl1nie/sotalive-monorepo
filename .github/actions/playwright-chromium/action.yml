name: Playwright Chromium
description: >-
  Playwright の Chromium を用意する(packages/shared の playwright と同じ版)。ブラウザー本体はキャッシュし、
  OS の依存パッケージ(apt)は、ミラーが遅くて止まることがあるので、1 回ごとに時間を区切って再試行する。
  先に pnpm install --frozen-lockfile を済ませておく
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "playwright=$(pnpm --filter @sotalive/shared exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.version.outputs.playwright }}
    - name: Install the browser (skipped from cache)
      # キャッシュがあれば飛ばす: `playwright install` が、キャッシュに当たったあとも、10 分止まったことがある(2026-10-27、legacy・myact-golden)。
      # composite の step には timeout-minutes が使えず、timeout は孫の node が出力を握ったままだと終われない
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: timeout -k 10 300 pnpm --filter @sotalive/shared exec playwright install chromium
    - name: Install OS dependencies (EXPERIMENT: skipped)
      shell: bash
      run: echo "skipped to see whether the runner image already has what Chromium needs"
