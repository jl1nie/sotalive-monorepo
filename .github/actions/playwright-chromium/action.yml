name: Playwright Chromium
description: >-
  Playwright の Chromium を用意する(packages/shared の playwright と同じ版)。ブラウザー本体はキャッシュし、
  OS の依存パッケージ(apt)は、ミラーが遅くて止まることがあるので、1 回ごとに時間を区切って再試行する。
  先に pnpm install --frozen-lockfile を済ませておく
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "playwright=$(pnpm --filter @sotalive/shared exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.version.outputs.playwright }}
    - name: Install the browser (skipped from cache)
      # キャッシュがあれば飛ばす: `playwright install` が、キャッシュに当たったあとも、10 分止まったことがある(2026-10-27、legacy・myact-golden)。
      # composite の step には timeout-minutes が使えず、timeout は孫の node が出力を握ったままだと終われない
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: timeout -k 10 300 pnpm --filter @sotalive/shared exec playwright install chromium
    - name: Make apt fail fast on a stalled download
      shell: bash
      # ミラーが止まると、apt は何分も待つ。20 秒データが来なければ、apt 自身が切って、3 回までやり直す
      run: |
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'DPkg::Lock::Timeout "120";' \
          | sudo tee /etc/apt/apt.conf.d/99ci-fast >/dev/null
    - name: Install OS dependencies (retry)
      shell: bash
      # timeout で打ち切ると、apt・dpkg が残ってロックを持ったままになり、次の試行が即座に失敗する(終了コード 100)。
      # 打ち切ったら、残った apt・dpkg を止めて、dpkg の途中の状態を直してから、やり直す
      run: |
        for attempt in 1 2 3; do
          if timeout 200 pnpm --filter @sotalive/shared exec playwright install-deps chromium; then
            exit 0
          fi
          echo "::warning::playwright install-deps の ${attempt} 回目が、失敗か時間切れ。残った apt を止めて、やり直す"
          sudo pkill -x apt-get || true
          sudo pkill -x apt || true
          sudo pkill -x dpkg || true
          sleep 2
          sudo dpkg --configure -a || true
        done
        echo "::error::playwright install-deps が 3 回とも失敗した"
        exit 1
