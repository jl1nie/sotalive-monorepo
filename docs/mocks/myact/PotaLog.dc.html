<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>POTA ログのダイアログ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
body{margin:0;font-family:Lato,'Helvetica Neue',Arial,Helvetica,sans-serif}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width:600px;height:700px;box-sizing:border-box;background:rgba(0,0,0,.45);padding:20px;display:flex;align-items:flex-start;justify-content:center;font-size:14px;line-height:1.4;color:#212529">
  <div role="dialog" aria-label="POTA ログ" style="width:560px;background:#ffffff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;flex-direction:column">

    <div style="display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid #dee2e6">
      <b style="font-size:16px">POTA ログ</b>
      <span style="margin-left:10px;font-size:12px;color:#6c757d">ログは、サーバーに保存されます(ログインは要りません)</span>
      <button type="button" aria-label="閉じる" style="margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;color:#6c757d;cursor:pointer">×</button>
    </div>

    <div style="padding:16px 18px;display:flex;flex-direction:column;gap:16px">

      <!-- 地図に出すログ -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <b style="font-size:13px">地図に出すログ</b>
        <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="showlog" checked> 地図とポップアップに、POTA ログを反映する(マーカーの色・Activations/QSOs)</label>
        <fieldset style="border:1px solid #dee2e6;border-radius:3px;margin:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px">
          <legend style="font-size:12px;color:#6c757d;padding:0 4px">どのログを使うか</legend>
          <div style="display:flex;align-items:center;gap:10px;min-height:36px">
            <input type="radio" name="kind" id="act" checked>
            <label for="act" style="flex:1"><b>Activator</b><span style="color:#6c757d;font-size:12px"> &nbsp; 2026-09-01 更新</span></label>
            <button type="button" style="height:30px;border:1px solid #dc3545;background:#ffffff;color:#dc3545;border-radius:3px;padding:0 12px;font-size:12px;cursor:pointer">削除</button>
          </div>
          <div style="display:flex;align-items:center;gap:10px;min-height:36px">
            <input type="radio" name="kind" id="hunt">
            <label for="hunt" style="flex:1"><b>Hunter</b><span style="color:#6c757d;font-size:12px"> &nbsp; 2026-08-01 更新</span></label>
            <button type="button" style="height:30px;border:1px solid #dc3545;background:#ffffff;color:#dc3545;border-radius:3px;padding:0 12px;font-size:12px;cursor:pointer">削除</button>
          </div>
        </fieldset>
      </div>

      <!-- アップロード -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <b style="font-size:13px">ログをアップロード</b>
        <div style="display:flex;gap:8px;align-items:center">
          <label for="csv" style="flex:1;height:34px;border:1px dashed #adb5bd;border-radius:3px;display:flex;align-items:center;padding:0 10px;font-size:12px;color:#495057;background:#f8f9fa">POTA.app からダウンロードした CSV を選ぶ(activator_log.csv)</label>
          <input type="file" id="csv" style="position:absolute;left:-9999px">
          <button type="button" style="height:34px;border:0;background:#007bff;color:#ffffff;border-radius:3px;padding:0 16px;font-weight:700;cursor:pointer">アップロード</button>
        </div>
        <span style="font-size:12px;color:#6c757d">Activator か Hunter かは、ファイルの中身で自動で分かります。同じ種類は、上書きされます。</span>
        <div role="status" style="font-size:12px;padding:6px 10px;border-radius:3px;background:#d1e7dd;color:#0f5132">Activator のログを取り込みました(2026-10-27 更新)。</div>
      </div>

      <!-- 共有 -->
      <div style="display:flex;flex-direction:column;gap:8px">
        <b style="font-size:13px">別の端末と共有</b>
        <div style="display:flex;gap:8px;align-items:center">
          <button type="button" style="height:34px;border:1px solid #6c757d;background:#ffffff;color:#212529;border-radius:3px;padding:0 14px;cursor:pointer">共有キーを作る</button>
          <span style="font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;letter-spacing:2px">ABC123</span>
          <button type="button" style="height:30px;border:0;background:#e9ecef;border-radius:3px;padding:0 10px;font-size:12px;cursor:pointer">コピー</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <label for="imp" style="position:absolute;left:-9999px">共有キー</label>
          <input id="imp" type="text" placeholder="共有キーを入れる" style="width:170px;height:34px;border:1px solid #ced4da;border-radius:3px;padding:0 10px;box-sizing:border-box;font-size:14px">
          <button type="button" style="height:34px;border:1px solid #6c757d;background:#ffffff;color:#212529;border-radius:3px;padding:0 14px;cursor:pointer">取り込む</button>
          <span style="font-size:12px;color:#6c757d">見つからないときは、その旨を出します</span>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;border-top:1px solid #dee2e6;padding-top:12px">
        <button type="button" style="height:34px;border:1px solid #17a2b8;background:#ffffff;color:#117a8b;border-radius:3px;padding:0 14px;cursor:pointer">全体の統計を見る</button>
        <span style="font-size:12px;color:#6c757d">アップロードされたログ数と総エントリ数(棒グラフ)</span>
        <span style="flex:1"></span>
        <button type="button" style="height:34px;border:0;background:#6c757d;color:#ffffff;border-radius:3px;padding:0 18px;cursor:pointer">閉じる</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
