<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
body{margin:0;font-family:Lato,'Helvetica Neue',Arial,Helvetica,sans-serif}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="width:600px;height:900px;box-sizing:border-box;background:#ffffff;color:#212529;font-size:14px;line-height:1.4;display:flex;flex-direction:column;border:1px solid #dee2e6">

  <div style="display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid #dee2e6;background:#f8f9fa">
    <b style="font-size:16px">設定</b>
    <span style="margin-left:10px;font-size:12px;color:#6c757d">この端末に保存します(Cookie。旧版と同じ名前なので、そのまま引き継ぎます)</span>
  </div>

  <div style="flex:1;overflow:hidden;padding:14px 18px;display:flex;flex-direction:column;gap:16px">

    <section style="display:flex;flex-direction:column;gap:6px">
      <b style="font-size:13px">地図に出すもの</b>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px">
        <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> SOTA の山</label>
        <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> POTA の公園</label>
        <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> JAFF の公園</label>
        <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> 公園の区域</label>
        <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> SOTA APRS</label>
      </div>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #dee2e6;padding-top:12px">
      <b style="font-size:13px">マーカー</b>
      <div style="display:flex;align-items:center;gap:12px"><label for="zt" style="width:230px;font-size:13px">全ての公園を出すズーム</label><input id="zt" type="range" min="7" max="12" value="12" style="flex:1"><span style="width:24px;text-align:right">12</span></div>
      <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> 公園名を常に表示する</label>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #dee2e6;padding-top:12px">
      <b style="font-size:13px">ポップアップの見出し</b>
      <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> POTA の参照を出す</label>
      <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> JAFF の参照を出す</label>
    </section>

    <section style="display:flex;flex-direction:column;gap:6px;border-top:1px solid #dee2e6;padding-top:12px">
      <b style="font-size:13px">リンク</b>
      <div style="display:flex;gap:20px;align-items:center;min-height:32px">
        <span style="font-size:13px;width:90px">位置のリンク</span>
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="map" checked> 地理院地図</label>
        <label style="display:flex;align-items:center;gap:6px"><input type="radio" name="map"> Google マップ</label>
      </div>
      <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox"> マップコード(japanmapcode.com)のリンクを出す</label>
    </section>

    <section style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #dee2e6;padding-top:12px">
      <b style="font-size:13px">スポット</b>
      <div style="display:flex;align-items:center;gap:12px"><label for="sp" style="width:230px;font-size:13px">最新の何時間を出すか</label><input id="sp" type="range" min="1" max="24" value="6" style="flex:1"><span style="width:40px;text-align:right">6 時間</span></div>
    </section>

    <!-- 必須の 2 つは、設定の中に隠さず、ここから入口も作る -->
    <section style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #dee2e6;padding-top:12px">
      <b style="font-size:13px">POTA ログ・ActPaddle</b>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button type="button" style="height:34px;border:0;background:#2e7d32;color:#ffffff;border-radius:3px;padding:0 16px;font-weight:700;cursor:pointer">POTA ログを開く</button>
        <span style="font-size:12px;color:#6c757d">Activator 2026-09-01 / Hunter 2026-08-01</span>
      </div>
      <label style="display:flex;align-items:center;gap:8px;min-height:32px"><input type="checkbox" checked> ActPaddle(パドルエミュレータ)を使う — ポップアップに、ボタンを出します</label>
      <span style="font-size:12px;color:#6c757d">CALL・メッセージ・送り方は、ActPaddle のダイアログで設定します。</span>
    </section>
  </div>

  <div style="display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid #dee2e6">
    <button type="button" style="height:36px;border:0;background:#007bff;color:#ffffff;border-radius:3px;padding:0 24px;font-weight:700;cursor:pointer">閉じる</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
